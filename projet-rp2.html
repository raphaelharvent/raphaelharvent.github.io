<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>RP2 – CICAR · Portfolio Raphaël Harvent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--accent:#00e5ff;--accent2:#7c3aed;--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
    *{box-sizing:border-box;}
    body{font-family:var(--font-body);scroll-behavior:smooth;display:flex;flex-direction:column;min-height:100vh;}
    h1,h2,h3,h4,.navbar-brand{font-family:var(--font-display);}
    .navbar{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06);}
    .navbar-brand{font-size:1.4rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .projet-hero{position:relative;overflow:hidden;padding:3.5rem 0 2.5rem;background:radial-gradient(ellipse 80% 60% at 60% 40%,rgba(0,229,255,0.07) 0%,transparent 70%),radial-gradient(ellipse 50% 50% at 10% 80%,rgba(124,58,237,0.09) 0%,transparent 60%);}
    .projet-hero::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.025) 39px,rgba(255,255,255,0.025) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,0.025) 39px,rgba(255,255,255,0.025) 40px);}
    .back-btn{display:inline-flex;align-items:center;gap:0.5rem;color:var(--accent);text-decoration:none;font-size:0.85rem;font-weight:600;letter-spacing:0.04em;margin-bottom:1.25rem;transition:gap 0.2s;}
    .back-btn:hover{gap:0.8rem;color:var(--accent);}
    .projet-tag{display:inline-block;background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.3);color:var(--accent);border-radius:100px;padding:0.25rem 0.85rem;font-size:0.75rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:1rem;}
    .projet-title{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:0.75rem;}
    .btn-dl{display:inline-flex;align-items:center;gap:0.5rem;background:linear-gradient(135deg,rgba(0,229,255,0.12),rgba(124,58,237,0.12));border:1px solid rgba(0,229,255,0.3);border-radius:10px;padding:0.55rem 1.25rem;font-size:0.85rem;font-weight:600;color:var(--accent);text-decoration:none;transition:background 0.2s,border-color 0.2s;}
    .btn-dl:hover{background:linear-gradient(135deg,rgba(0,229,255,0.2),rgba(124,58,237,0.2));border-color:rgba(0,229,255,0.5);color:var(--accent);}
    .pdf-wrapper{flex:1;background:#0d0f14;border-top:1px solid rgba(255,255,255,0.06);}
    .pdf-wrapper iframe{display:block;width:100%;height:calc(100vh - 220px);min-height:600px;border:none;}
    footer{border-top:1px solid rgba(255,255,255,0.06);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .fi1{animation:fadeUp 0.5s ease both;}.fi2{animation:fadeUp 0.5s 0.12s ease both;}.fi3{animation:fadeUp 0.5s 0.24s ease both;}
  </style>
</head>
<body>

  <nav class="navbar sticky-top bg-body">
    <div class="container">
      <a class="navbar-brand" href="index.html">RH</a>
      <a href="index.html#projets" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Retour au portfolio
      </a>
    </div>
  </nav>

  <div class="projet-hero">
    <div class="container">
      <a href="index.html#projets" class="back-btn fi1">
        <i class="bi bi-arrow-left"></i> Retour aux projets
      </a>
      <span class="projet-tag fi1"><i class="bi bi-file-earmark-text me-1"></i>Projet AFPI · CICAR</span>
      <h1 class="projet-title fi2">RP2 – CICAR</h1>
      <p class="fi2" style="opacity:0.7;font-size:1rem;line-height:1.8;max-width:600px;">Compte-rendu d'intervention et de réalisation professionnelle n°2 réalisé dans le cadre du BTS SIO SISR à l'AFPI.</p>
      <div class="d-flex gap-2 flex-wrap mt-3 fi3">
        <a href="assets/RP2_CICAR_RaphaelHARVENT_corrige.pdf" download class="btn-dl">
          <i class="bi bi-download me-1"></i>Télécharger le PDF
        </a>
      </div>
    </div>
  </div>

  <div class="pdf-wrapper">
    <iframe src="assets/RP2_CICAR_RaphaelHARVENT_corrige.pdf" title="RP2 – CICAR"></iframe>
  </div>

  <footer class="py-4 text-center small text-muted">
    © <span id="year"></span> Raphaël Harvent — Portfolio BTS SIO SISR
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
